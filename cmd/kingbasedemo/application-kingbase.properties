# KingbaseES 人大金仓（PostgreSQL 兼容，默认端口 54321）
spring.datasource.url= jdbc:kingbase8://localhost:54321/testdb
spring.datasource.username= system
spring.datasource.password= 123456
# 可选 schema（PG/Kingbase）：也可通过 url 参数指定 ?currentSchema=myschema / ?search_path=myschema
#spring.datasource.schema= myschema
# 连接池设置（可选，省略则使用框架默认值）
spring.datasource.max-idle= 100
spring.datasource.max-open= 100
spring.datasource.max-timeout= 100
mybatis.mapper-locations= resources/mapper
