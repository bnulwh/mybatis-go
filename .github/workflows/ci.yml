name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./log/... ./types/... ./utils/... ./orm/...

      - name: Coverage
        run: go test -count=1 -coverprofile=cover.out ./...
